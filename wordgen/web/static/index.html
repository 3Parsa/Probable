<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>probable</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>probable</h1>
<p>Targeted, ranked password candidate generator.</p>

<form id="gen-form">
  <label>Names <input type="text" name="names" placeholder="Ahmet, Ahmet1998"></label>
  <label>Dates <input type="text" name="dates" placeholder="1998-06-12"></label>
  <label>Pets <input type="text" name="pets" placeholder="Boncuk"></label>
  <label>Teams <input type="text" name="teams" placeholder="Galatasaray"></label>
  <label>Places <input type="text" name="places" placeholder="Istanbul"></label>
  <label>Partner <input type="text" name="partner" placeholder="Ayse"></label>
  <label>Custom <input type="text" name="custom" placeholder="go-eagles"></label>

  <label>Size
    <select name="size">
      <option value="small">small</option>
      <option value="medium" selected>medium</option>
      <option value="large">large</option>
    </select>
  </label>

  <div class="buttons">
    <button type="submit">Generate</button>
    <a id="download-link" href="#">Download full list</a>
  </div>
</form>

<section id="results">
  <p id="total"></p>
  <ol id="preview"></ol>
</section>

<script src="/static/app.js"></script>
</body>
</html>
