<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>probable</title>
<link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
<div class="page">

  <div class="topbar">
    <header class="masthead">
      <h1>probable<span class="cursor">_</span></h1>
      <p class="tagline">Targeted, ranked password candidate generator.</p>
    </header>

    <a
      class="gh-link"
      href="https://github.com/Theparsaw/probable"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="View source on GitHub"
      title="View source on GitHub"
    >
      <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
      <span class="gh-link-text">GitHub</span>
    </a>
  </div>

  <form id="gen-form" class="panel form-panel">
    <div class="field-grid">
      <label class="field">
        <span class="field-label">Names</span>
        <input type="text" name="names" placeholder="Michael" autocomplete="off">
      </label>

      <label class="field">
        <span class="field-label">Dates</span>
        <input type="text" name="dates" placeholder="1995-03-15" autocomplete="off">
      </label>

      <label class="field">
        <span class="field-label">Pets</span>
        <input type="text" name="pets" placeholder="Buddy" autocomplete="off">
      </label>

      <label class="field">
        <span class="field-label">Teams</span>
        <input type="text" name="teams" placeholder="Liverpool" autocomplete="off">
      </label>

      <label class="field">
        <span class="field-label">Places</span>
        <input type="text" name="places" placeholder="London" autocomplete="off">
      </label>

      <label class="field">
        <span class="field-label">Partner</span>
        <input type="text" name="partner" placeholder="Emily" autocomplete="off">
      </label>

      <label class="field field-span">
        <span class="field-label">Custom</span>
        <input type="text" name="custom" placeholder="sunshine" autocomplete="off">
      </label>
    </div>

    <div class="controls">
      <label class="field size-field">
        <span class="field-label">Size</span>
        <select name="size">
          <option value="small">small</option>
          <option value="medium" selected>medium</option>
          <option value="large">large</option>
        </select>
      </label>

      <div class="actions">
        <button type="submit" id="generate-btn">
          <span class="btn-label">Generate</span>
        </button>
        <button type="button" id="load-example-btn" class="btn-secondary">Load example</button>
        <a id="download-link" class="btn-ghost" href="#">Download full list</a>
      </div>
    </div>
  </form>

  <section id="results" class="panel results-panel is-empty">
    <div class="results-header">
      <p id="total">No candidates generated yet</p>
      <button type="button" id="copy-btn" class="btn-secondary" hidden>Copy</button>
    </div>
    <ol id="preview"></ol>
    <p class="empty-state">Fill in what you know about the target, then hit <strong>Generate</strong>. Ranked candidates will appear here.</p>
  </section>

</div>

<script src="/static/app.js?v=5"></script>
</body>
</html>
